<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CVS Health — Pharmacy Counter Auth Demo</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="pharmacy.css" />
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="cvs-logo"><span class="cvs-r">CVS</span><span class="cvs-h">health</span></div>
        <span class="demo-badge pharm-badge">Pharmacy Counter</span>
      </div>
      <div class="step-meta">
        <span class="step-counter" id="stepCounter">Step 1 of 5</span>
        <span class="step-title" id="stepTitle">QR code displayed at sale counter</span>
      </div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </header>

  <main>
    <div class="stage">

      <!-- POS TERMINAL -->
      <div class="col">
        <div class="col-label"><span class="dot pos-dot"></span>POS Terminal</div>
        <div class="terminal-wrap">
          <div class="terminal">
            <div class="terminal-screen" id="posScreen"></div>
            <div class="terminal-base">
              <span class="t-light green" id="tLightGreen"></span>
              <span class="t-light amber" id="tLightAmber"></span>
              <span class="t-brand">CVS/pharmacy</span>
            </div>
          </div>
        </div>
      </div>

      <!-- SERVER -->
      <div class="col server-col">
        <div class="col-label"><span class="dot srv"></span>Server</div>
        <div class="server-log" id="serverLog">
          <p class="srv-idle">Awaiting requests…</p>
        </div>
      </div>

      <!-- CUSTOMER PHONE -->
      <div class="col">
        <div class="col-label"><span class="dot app"></span>Customer's Phone</div>
        <div class="phone-wrap">
          <div class="phone">
            <div class="phone-inner">
              <div class="notch"></div>
              <div class="phone-screen" id="appScreen"></div>
              <div class="home-bar"></div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer>
    <div class="controls">
      <button class="ctrl secondary" id="btnPrev" onclick="prevStep()">&#8592; Prev</button>
      <div class="dots" id="dots"></div>
      <button class="ctrl primary" id="btnNext" onclick="nextStep()">Next &#8594;</button>
    </div>
  </footer>

  <script src="pharmacy.js"></script>
</body>
</html>
